# =============================================================================
# Gabarits de génération de phrases (arabe tchadien latinisé <-> français)
# =============================================================================
#
# Principe : chaque mot arabe tchadien (td) est un MOT-VEDETTE DU LEXIQUE.
# Les formes fléchies (inaccompli conjugué, féminin des adjectifs) sont tirées
# de la colonne `forms` du lexique, jamais inventées. Le français est écrit à
# la main (conjugaison et accords corrects).
#
# Toutes les phrases produites ont le statut « brouillon » : elles doivent être
# relues et validées par un locuteur avant enregistrement.
#
# Syntaxe des gabarits
#   {P}        pronom sujet td (ana, inta, hu, hi)          — côté td seulement
#   {V}        verbe : td = inaccompli conjugué à la personne {P} ; fr = forme
#              conjuguée AVEC son sujet (« j'achète »)
#   {X}        mot d'un slot X (td = mot-vedette)
#   {@X}       td : X avec l'article défini (al- / l- après une voyelle)
#   {X.cle}    fr : variante française de X (ex. {N.part} = « de la viande »)
#   {A}        adjectif accordé avec le slot indiqué par `accord`
#   @mot       td : article défini sur un mot écrit en dur (« @matar » -> al-matar)
#
# Le français et le td d'un même gabarit utilisent les mêmes slots.
# =============================================================================

personnes:
  # Les 10 pronoms du cours (chapitre 9), tous présents dans le lexique. L'inaccompli n'est
  # généré que pour ana/inta/hu/hi (seules personnes documentées), l'accompli pour les dix.
  ana: { fr: je, genre: m, nombre: sg }
  inta: { fr: tu, genre: m, nombre: sg }
  inti: { fr: tu, genre: f, nombre: sg }
  hu: { fr: il, genre: m, nombre: sg }
  hi: { fr: elle, genre: f, nombre: sg }
  aniina: { fr: nous, genre: m, nombre: pl }
  intu: { fr: vous, genre: m, nombre: pl }
  intan: { fr: vous, genre: f, nombre: pl }
  humman: { fr: ils, genre: m, nombre: pl }
  hinna: { fr: elles, genre: f, nombre: pl }
