themes:
  salutations:
    titre: Salutations et politesse
    gabarits:
      - id: sal-appel
        td: "Salaam, ya {X}!"
        fr: "Bonjour, {X.txt} !"
        slots: { X: personnes_appel }
      - id: sal-sante
        td: "{P} aafe?"
        fr: "{P.fr} vas bien ?"
        personnes: [inta]
      - id: sal-sante-3
        td: "{P} aafe?"
        fr: "Est-ce qu'{P.fr} va bien ?"
        personnes: [hu, hi]
    phrases:
      - { td: "Salaam aleekum.", fr: "Que la paix soit sur vous." }
      - {
          td: "Aywa, ana aafe, hamdulillah.",
